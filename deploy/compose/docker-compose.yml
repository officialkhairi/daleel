name: daleel

# Shared by the api (uploads, query embeddings) and the worker (ingestion).
x-storage-env: &storage-env
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}

x-embeddings-env: &embeddings-env
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER}
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
  EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL}
  EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY}

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  # Official MinIO images are no longer published; Chainguard builds MinIO from source.
  # Pinned by digest because the free tier only exposes `latest`.
  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:72f9978d415ea8294d78051fb3aee2fd258d449237633f77f100b5367bb5225d
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET}"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Tokens are always issued for http://localhost:8080 (what the browser sees),
      # while the API container fetches JWKS over the internal network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      SMOKE_CLIENT_SECRET: ${SMOKE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"

  # One-shot: applies migrations as the owner role, so the API never holds owner credentials.
  migrate:
    build: ../../apps/api
    image: daleel-api:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      OIDC_ISSUER: unused-by-migrations
      OIDC_JWKS_URL: unused-by-migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: daleel-api:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/daleel/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      JWKS_CACHE_TTL_SECONDS: ${JWKS_CACHE_TTL_SECONDS}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_STREAM_USAGE: ${LLM_STREAM_USAGE}
      LLM_PRICE_IN_PER_MTOK: ${LLM_PRICE_IN_PER_MTOK}
      LLM_PRICE_OUT_PER_MTOK: ${LLM_PRICE_OUT_PER_MTOK}
      LLM_FAKE_DELAY_MS: ${LLM_FAKE_DELAY_MS}
      LLM_TOOL_MODE: ${LLM_TOOL_MODE}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS}
      APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS}
      # Side effects (only after a person approves them).
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM}
      TICKETING_URL: http://mock-ticketing:8090
      TICKETING_TOKEN: ${TICKETING_TOKEN}
      <<: [*storage-env, *embeddings-env]
      LOG_LEVEL: ${LOG_LEVEL}
    # Lets LLM_BASE_URL point at a model server on the host (e.g. Ollama on macOS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      mock-ticketing:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        LOCAL_EMBEDDINGS: ${WORKER_LOCAL_EMBEDDINGS}
    image: daleel-worker:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      <<: [*storage-env, *embeddings-env]
      # Read by the shared Settings class; the worker doesn't authenticate users.
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: unused-by-worker
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - model-cache:/models  # Hugging Face cache: bge-m3 downloads once
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      # The first start may download the embedding model (~2.3 GB).
      start_period: 900s
      test: ["CMD", "arq", "--check", "daleel_worker.main.WorkerSettings"]

  # Stand-in for Jira/ServiceNow; tickets at http://localhost:8090
  mock-ticketing:
    build: ../../apps/mock-ticketing
    image: daleel-mock-ticketing:dev
    environment:
      TICKETING_TOKEN: ${TICKETING_TOKEN}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
    image: daleel-web:dev
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  # `docker compose --profile local-llm up -d ollama` then
  # `docker compose exec ollama ollama pull falcon3:3b`
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    environment:
      # Grounded prompts (6 sources) need more than Ollama's default context.
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  model-cache:
  ollama-data:
  postgres-data:
  redis-data:
  minio-data:
