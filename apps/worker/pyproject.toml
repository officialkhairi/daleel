[project]
name = "daleel-worker"
version = "0.1.0"
description = "Arq jobs: document ingestion and embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "daleel-api",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# BAAI/bge-m3 in-process (EMBEDDINGS_PROVIDER=sentence_transformers). CPU-only PyTorch.
local-embeddings = [
    "sentence-transformers>=3",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daleel_worker"]

[tool.uv.sources]
daleel-api = { path = "../api", editable = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "PT", "RUF", "N"]
ignore = ["RUF001", "RUF003"]  # Arabic letters are not "ambiguous" in a bilingual codebase

[tool.ruff.lint.isort]
known-first-party = ["app", "daleel_worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["daleel_worker", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pymupdf.*", "docx.*", "sentence_transformers.*", "minio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false  # PyMuPDF has no type hints

[tool.pytest.ini_options]
filterwarnings = [
    # PyMuPDF's SWIG bindings, on import.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__:DeprecationWarning",
]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test stuck this long dumps every thread's stack, so a hang in CI shows where it is.
faulthandler_timeout = 120
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["daleel_worker"]
concurrency = ["greenlet", "thread"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15",
]
