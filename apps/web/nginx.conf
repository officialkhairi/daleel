server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Upstreams are looked up per request (a variable in proxy_pass + Docker's DNS), so a
  # recreated api container with a new IP is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  # Notifications (WebSocket upgrade): /api/ws, and the older /api/ws/documents.
  location /api/ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Browser traces to the OpenTelemetry collector (only running with the `obs` profile).
  # The deferred lookup also lets nginx start without the collector.
  location /otel/ {
    set $collector http://otel-collector:4318;
    rewrite ^/otel/(.*)$ /$1 break;
    proxy_pass $collector;
    client_max_body_size 1m;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # SSE (Phase 2) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 26m;
  }

  # nginx's MIME table doesn't know .mjs (the pdf.js worker); browsers refuse module scripts
  # served as application/octet-stream.
  location ~* \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
