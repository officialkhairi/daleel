[project]
name = "daleel-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "arq>=0.28",
    "asyncpg>=0.32.0",
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "redis<6",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "PT", "RUF", "N"]
ignore = [
    "B008", # FastAPI's Depends() in defaults is idiomatic
    "N818", # exception names mirror HTTP statuses (Unauthorized, Forbidden)
    "RUF001", "RUF003", # Arabic letters are not "ambiguous" in a bilingual codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test stuck this long dumps every thread's stack, so a hang in CI shows where it is.
faulthandler_timeout = 120
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient (used for the WebSocket test) nudges toward httpx2; not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs on greenlets; without this, lines after a DB call go unseen.
concurrency = ["greenlet", "thread"]
omit = ["app/db/migrations/*"]
