name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest (Testcontainers Postgres)
        run: uv run pytest -v --cov --cov-report=term-missing

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      # Without the local-embeddings extra: tests use fake embeddings, so no PyTorch download.
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest (Testcontainers Postgres, Redis, MinIO)
        run: uv run pytest -v --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run lint
      - run: pnpm -r run typecheck
      - run: pnpm -r run test

  mock-ticketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mock-ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run pytest -q

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daleel/ui build-storybook

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: cp .env.example .env && docker compose -f deploy/compose/docker-compose.yml --env-file .env config -q

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv sync --frozen
      - name: golden-set evals (FakeProvider, fake embeddings)
        env:
          LLM_PROVIDER: fake
          LLM_MODEL: fake-echo
          EMBEDDINGS_PROVIDER: fake
        run: uv run python ../../evals/run_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals
          path: evals/results/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @daleel/e2e exec playwright install --with-deps chromium
      - name: Playwright + axe against the compose stack (fake LLM)
        run: make e2e
      - name: stack logs on failure
        if: failure()
        run: docker compose -p daleel -f deploy/compose/docker-compose.yml --env-file .env logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: e2e/test-results/

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: helm lint
        run: |
          helm lint deploy/helm/daleel
          helm lint deploy/helm/daleel -f deploy/helm/daleel/ci/kind-values.yaml
      - uses: helm/kind-action@v1
      - name: build images
        run: |
          docker build -t daleel.local/daleel-api:ci apps/api
          docker build -t daleel.local/daleel-worker:ci -f apps/worker/Dockerfile --build-arg LOCAL_EMBEDDINGS=false .
          docker build -t daleel.local/daleel-web:ci -f apps/web/Dockerfile .
          for c in api worker web; do kind load docker-image "daleel.local/daleel-$c:ci" --name chart-testing; done
      - name: install on kind
        run: helm install daleel deploy/helm/daleel -f deploy/helm/daleel/ci/kind-values.yaml --wait --timeout 10m
      - name: helm test
        run: helm test daleel --logs
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -n 200
          for d in api worker web; do kubectl logs deploy/daleel-$d --all-containers --tail 100 || true; done
